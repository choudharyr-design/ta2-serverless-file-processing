AWSTemplateFormatVersion: '2010-09-09'
Description: >
  TA-2 - Event-driven serverless file processing.
  S3 (ObjectCreated) -> Lambda (private subnet) -> SNS email alert.

Parameters:
  NotificationEmail:
    Type: String
    Description: Email address that will receive the SNS alerts
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
  PrivateSubnetCidr:
    Type: String
    Default: 10.0.2.0/24

Resources:
  # ---------------------------------------------------------------
  # NETWORKING
  # ---------------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: ta2-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: ta2-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: ta2-public-subnet

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: ta2-private-subnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: ta2-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: ta2-nat

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: ta2-private-rt

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  # Optional: private path to S3 (does not go over the public internet)
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the processing Lambda (outbound only)
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: ta2-lambda-sg

  # ---------------------------------------------------------------
  # MESSAGING (SNS)
  # ---------------------------------------------------------------
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: FileProcessingAlerts

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # ---------------------------------------------------------------
  # IAM ROLE FOR LAMBDA
  # ---------------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: S3AndSnsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:aws:s3:::ta2-file-processing-${AWS::AccountId}-${AWS::Region}/*
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertsTopic

  # ---------------------------------------------------------------
  # LAMBDA FUNCTION (in the private subnet)
  # ---------------------------------------------------------------
  ProcessingFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - PrivateRoute
      - PrivateSubnetRouteTableAssociation
    Properties:
      FunctionName: ta2-file-processor
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          TOPIC_ARN: !Ref AlertsTopic
      VpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
      Code:
        ZipFile: |
          import json
          import os
          import urllib.parse
          from datetime import datetime, timezone

          import boto3

          s3 = boto3.client("s3")
          sns = boto3.client("sns")

          TOPIC_ARN = os.environ["TOPIC_ARN"]


          def lambda_handler(event, context):
              summaries = []

              for record in event.get("Records", []):
                  bucket = record["s3"]["bucket"]["name"]
                  key = urllib.parse.unquote_plus(record["s3"]["object"]["key"])

                  # Safety: never process our own output (avoids infinite loop)
                  if key.startswith("processed/"):
                      continue

                  head = s3.head_object(Bucket=bucket, Key=key)
                  size = head["ContentLength"]
                  ctype = head.get("ContentType", "unknown")
                  now = datetime.now(timezone.utc).isoformat()

                  metadata = {
                      "bucket": bucket,
                      "key": key,
                      "size_bytes": size,
                      "content_type": ctype,
                      "processed_at_utc": now,
                      "request_id": context.aws_request_id,
                  }

                  # Write processed metadata log back to S3
                  log_key = "processed/" + key.split("/")[-1] + ".json"
                  s3.put_object(
                      Bucket=bucket,
                      Key=log_key,
                      Body=json.dumps(metadata, indent=2).encode("utf-8"),
                      ContentType="application/json",
                  )

                  summaries.append(
                      "File: s3://%s/%s | Size: %s bytes | Type: %s | Log: %s"
                      % (bucket, key, size, ctype, log_key)
                  )

              if summaries:
                  sns.publish(
                      TopicArn=TOPIC_ARN,
                      Subject="File processed successfully",
                      Message="\n".join(summaries),
                  )

              return {"statusCode": 200, "body": json.dumps(summaries)}

  # Lets S3 invoke the Lambda (resource-based policy)
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProcessingFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:aws:s3:::ta2-file-processing-${AWS::AccountId}-${AWS::Region}

  # ---------------------------------------------------------------
  # STORAGE (S3)
  # ---------------------------------------------------------------
  FileBucket:
    Type: AWS::S3::Bucket
    DependsOn: LambdaInvokePermission
    Properties:
      BucketName: !Sub ta2-file-processing-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ProcessingFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

Outputs:
  BucketName:
    Description: Upload test files into the uploads/ folder of this bucket
    Value: !Ref FileBucket
  LambdaFunctionName:
    Value: !Ref ProcessingFunction
  SnsTopicArn:
    Value: !Ref AlertsTopic
  VpcId:
    Value: !Ref VPC
